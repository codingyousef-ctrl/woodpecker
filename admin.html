<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الإدارة</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .login-box { max-width: 300px; margin: 100px auto; background: white; padding: 20px; border-radius: 10px; }
        #dashboard { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div id="login-screen" class="login-box">
    <h3>دخول الإدارة</h3>
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button onclick="checkPass()">دخول</button>
</div>

<div id="dashboard">
    <h1>قائمة الأطفال المسجلين</h1>
    <table>
        <thead><tr><th>الاسم</th><th>اسم الأب</th><th>الهاتف</th></tr></thead>
        <tbody id="data-body"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPkQg_4ilvZoLZ7qdRYb_0Gq1pCHylQ0",
        authDomain: "woodpecker-508d8.firebaseapp.com",
        projectId: "woodpecker-508d8",
        storageBucket: "woodpecker-508d8.firebasestorage.app",
        messagingSenderId: "434327620481",
        appId: "1:434327620481:web:99d8d5e0af9ae5eafa3680"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    window.checkPass = function() {
        if(document.getElementById('pass').value === "123456") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            onSnapshot(collection(db, "registrations"), (snapshot) => {
                const body = document.getElementById("data-body");
                body.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    body.innerHTML += `<tr><td>${data.fullname}</td><td>${data.father_name}</td><td>${data.phone}</td></tr>`;
                });
            });
        } else { alert("كلمة المرور خاطئة!"); }
    }
</script>
</body>
</html>
