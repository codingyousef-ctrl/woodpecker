<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة إدارة حضانة نقار الخشب</title>
    <style>
        body { font-family: sans-serif; background: #fdf6f0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .clickable { color: #d4537e; cursor: pointer; font-weight: bold; }
        /* تصميم النافذة المنبثقة */
        #modal { display: none; position: fixed; top: 20%; left: 30%; width: 40%; background: white; padding: 20px; border: 2px solid #ffcc80; border-radius: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <input type="password" id="pass" placeholder="كلمة المرور">
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="dashboard" style="display:none;">
        <table>
            <thead><tr><th>اسم الطفل</th><th>اسم الأم</th><th>هاتف الأم</th></tr></thead>
            <tbody id="data-body"></tbody>
        </table>
    </div>
</div>

<!-- النافذة المنبثقة للتفاصيل -->
<div id="modal">
    <h3>تفاصيل الطفل</h3>
    <div id="modal-content"></div>
    <button onclick="document.getElementById('modal').style.display='none'">إغلاق</button>
</div>

<script type="module">
    // ... (كود Firebase كما هو في المرات السابقة) ...
    
    // عند بناء الجدول:
    snapshot.forEach((doc) => {
        const data = doc.data();
        const row = document.createElement("tr");
        row.innerHTML = `<td class="clickable">${data.fullname}</td><td>${data.mother_name}</td><td>${data.mother_phone}</td>`;
        
        // إضافة حدث الضغط لعرض التفاصيل
        row.querySelector('.clickable').onclick = () => {
            document.getElementById('modal-content').innerHTML = `
                <p>الاسم الكامل: ${data.fullname}</p>
                <p>اسم الأم: ${data.mother_name}</p>
                <p>هاتف الأم: ${data.mother_phone}</p>
                <p>العنوان: ${data.address || 'غير محدد'}</p>
            `;
            document.getElementById('modal').style.display = 'block';
        };
        document.getElementById("data-body").appendChild(row);
    });
</script>
</body>
</html>
