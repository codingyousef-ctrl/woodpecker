<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | حضانة نقار الخشب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* المتغيرات الأساسية للوضع الليلي (الافتراضي) */
        :root {
            --bg-color: #121418;
            --card-bg: #1e2025;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --primary: #d4537e;
            --primary-hover: #b8436b;
            --border-color: #2a2d35;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 12px;
        }

        /* متغيرات الوضع النهاري */
        body.light-mode {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s, color 0.3s; padding: 0; margin: 0; }
        
        /* حركة الارتجاج للشاشة الفاشلة */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .error-shake { animation: shake 0.4s ease-in-out; border-color: var(--danger) !important; }
        .error-text { color: var(--danger); font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; }
        
        /* شاشة تسجيل الدخول */
        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-color); }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: var(--radius); border: 1px solid var(--border-color); text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .login-card h2 { margin-bottom: 20px; color: var(--primary); }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; }
        .login-card button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-card button:hover { background: var(--primary-hover); }
        
        /* الهيكل الأساسي ممتد بالكامل لأطراف الشاشة */
        #dashboard { display: none; padding: 20px 40px; width: 100%; max-width: 100%; margin: 0; }
        
        /* الشريط العلوي */
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); width: 100%; }
        .nav-title { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .nav-actions { display: flex; gap: 10px; }
        .btn-icon { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn-icon:hover { border-color: var(--primary); }
        
        /* الإحصائيات ممتدة */
        .stats-grid { display: grid; grid-template-columns: 1fr; margin-bottom: 30px; width: 100%; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--primary); }
        .stat-title { color: var(--text-muted); font-size: 15px; font-weight: 600; }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: var(--text-main); }
        
        /* شريط البحث ممتد لآخر الصفحة من اليمين لليسار */
        .toolbar { display: flex; width: 100%; margin-bottom: 20px; }
        .search-box { flex: 1; width: 100%; }
        .search-box input { width: 100%; padding: 15px 20px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; font-size: 16px; }
        .search-box input:focus { border-color: var(--primary); }
        
        /* الجدول ممتد بكامل المساحة */
        .table-container { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border-color); overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { padding: 18px; background: rgba(0,0,0,0.1); color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-color); font-size: 15px; }
        td { padding: 18px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-size: 15px; }
        tr:hover { background: rgba(255,255,255,0.02); }
        body.light-mode tr:hover { background: rgba(0,0,0,0.02); }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-view { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        /* نافذة المعلومات ممتدة وعريضة لأطراف الصفحة */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); width: 95%; max-width: 1100px; border-radius: var(--radius); border: 1px solid var(--border-color); padding: 35px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .modal-header h3 { color: var(--primary); font-size: 20px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 26px; cursor: pointer; transition: 0.2s;}
        .close-btn:hover { color: var(--danger); }
        
        /* شبكة عرض كل بيانات الاستمارة بالتفصيل */
        .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .detail-item { background: var(--bg-color); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border-color); transition: 0.2s; }
        .detail-item:hover { border-color: var(--primary); }
        .detail-item span { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .detail-item strong { color: var(--text-main); font-size: 16px; display: block; word-break: break-all; }
    </style>
</head>
<body>

<!-- شاشة القفل -->
<div id="login-screen">
    <div class="login-card" id="login-box">
        <h2>🔒 نظام الإدارة</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">أدخل كلمة المرور للوصول للبيانات</p>
        <input type="password" id="pass" placeholder="كلمة المرور..." onkeypress="handleEnter(event)">
        <div id="error-msg" class="error-text">❌ كلمة المرور غير صحيحة!</div>
        <button onclick="checkPass()">تسجيل الدخول</button>
    </div>
</div>

<!-- لوحة التحكم الكاملة -->
<div id="dashboard">
    <div class="navbar">
        <div class="nav-title">🌸 حضانة نقار الخشب</div>
        <div class="nav-actions">
            <button class="btn-icon" onclick="toggleTheme()">☀️/🌙 المظهر</button>
            <button class="btn-icon" onclick="lockSystem()" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">🔒 قفل</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">إجمالي الطلاب المسجلين بالاستمارة</div>
            <div class="stat-value" id="total-students">0</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="بحث سريع باسم الطفل واضغط لتصفية الجدول الفوري..." onkeyup="filterTable()">
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>اسم الطفل</th>
                    <th>اسم الأم</th>
                    <th>رقم هاتف الأم</th>
                    <th>إجراءات الإدارة</th>
                </tr>
            </thead>
            <tbody id="data-body"></tbody>
        </table>
    </div>
</div>

<!-- نافذة عرض كافة معلومات الاستمارة كاملة (موسعة) -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>الملف الشامل لبيانات استمارة الطالب</h3>
            <button class="close-btn" onclick="closeModal('detailsModal')">&times;</button>
        </div>
        <div class="details-grid" id="student-details-content"></div>
    </div>
</div>

<script>
    function handleEnter(e) { if (e.key === 'Enter') checkPass(); }
    
    function checkPass() {
        const passInput = document.getElementById('pass');
        const loginBox = document.getElementById('login-box');
        const errorMsg = document.getElementById('error-msg');

        if(passInput.value === "123456") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            passInput.value = ''; 
            errorMsg.style.display = 'none'; 
            loginBox.classList.remove('error-shake');
            if(window.loadFirebaseData) window.loadFirebaseData(); 
        } else {
            errorMsg.style.display = 'block'; 
            loginBox.classList.remove('error-shake');
            setTimeout(() => { loginBox.classList.add('error-shake'); }, 10);
            passInput.value = '';
            passInput.focus();
        }
    }

    function lockSystem() {
        document.getElementById('pass').value = '';
        document.getElementById('error-msg').style.display = 'none';
        document.getElementById('login-box').classList.remove('error-shake');
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
    
    function filterTable() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let rows = document.getElementById('dataTable').getElementsByTagName('tr');
        for (let i = 1; i < rows.length; i++) {
            let nameCol = rows[i].cells[0].textContent.toLowerCase();
            rows[i].style.display = nameCol.includes(input) ? "" : "none";
        }
    }
</script>

<!-- معالجة بيانات الـ Firebase بشكل ديناميكي كامل -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPkQg_4ilvZoLZ7qdRYb_0Gq1pCHylQ0",
        authDomain: "woodpecker-508d8.firebaseapp.com",
        projectId: "woodpecker-508d8",
        storageBucket: "woodpecker-508d8.firebasestorage.app",
        messagingSenderId: "434327620481",
        appId: "1:434327620481:web:99d8d5e0af9ae5eafa3680"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let studentsData = [];

    window.loadFirebaseData = function() {
        onSnapshot(collection(db, "registrations"), (snapshot) => {
            const tableBody = document.getElementById("data-body");
            tableBody.innerHTML = "";
            studentsData = []; 
            document.getElementById("total-students").innerText = snapshot.size;

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                data.id = docSnap.id; 
                studentsData.push(data); 

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; color: var(--primary);">${data.fullname || data.child_name || 'غير محدد'}</td>
                    <td>${data.mother_name || 'غير محدد'}</td>
                    <td dir="ltr" style="text-align: right;">${data.mother_phone || data.phone || 'غير محدد'}</td>
                    <td class="action-btns">
                        <button class="btn-view" onclick="viewDetails('${data.id}')">👁️ عرض التفاصيل كاملة</button>
                        <button class="btn-delete" onclick="deleteStudent('${data.id}')">🗑️ حذف</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        });
    };

    // نظام ذكي يعرض كافة الحقول المدخلة أياً كانت مسمياتها في الـ index.html
    window.viewDetails = function(studentId) {
        const student = studentsData.find(s => s.id === studentId);
        if(!student) return;
        const content = document.getElementById('student-details-content');
        
        // قاموس ترجمة الحقول الشائعة لتظهر باللغة العربية بجمالية واحترافية
        const translationMap = {
            fullname: 'اسم الطفل الرباعي',
            child_name: 'اسم الطفل المكتوب',
            father_name: 'اسم الأب والشهرة',
            phone: 'رقم هاتف الأب / التواصل رئيسي',
            mother_name: 'اسم الأم الكامل',
            mother_phone: 'رقم هاتف الأم المباشر',
            address: 'عنوان السكن بالتفصيل',
            start_date: 'تاريخ بدء الالتحاق الفعلي',
            dob: 'تاريخ ميلاد الطفل',
            gender: 'الجنس',
            notes: 'حالة صحية أو ملاحظات خاصة',
            timestamp: 'تاريخ تقديم الطلب على الموقع'
        };

        let finalHtml = '';

        // 1. استخراج وعرض الحقول الأساسية المترجمة أولاً
        for (let key in translationMap) {
            if (student[key] !== undefined && student[key] !== null) {
                let displayVal = student[key];
                if (key === 'timestamp' && displayVal.seconds) {
                    displayVal = new Date(displayVal.seconds * 1000).toLocaleString('ar-EG');
                }
                finalHtml += `
                    <div class="detail-item">
                        <span>${translationMap[key]}</span>
                        <strong>${displayVal || '-'}</strong>
                    </div>
                `;
            }
        }

        // 2. استخراج الحقول الإضافية الأخرى (إن وجدت في استمارة index.html ولم تذكر أعلاه) لضمان عرض 100% من البيانات
        for (let key in student) {
            if (!translationMap[key] && key !== 'id' && key !== 'added_from_admin') {
                finalHtml += `
                    <div class="detail-item">
                        <span>حقل إضافي (${key})</span>
                        <strong>${student[key] || '-'}</strong>
                    </div>
                `;
            }
        }

        content.innerHTML = finalHtml;
        openModal('detailsModal');
    };

    window.deleteStudent = async function(id) {
        if(confirm("هل أنت متأكد تماماً من حذف هذا الطفل من سجلات الحضانة نهائياً؟")) {
            await deleteDoc(doc(db, "registrations", id));
        }
    };
</script>
</body>
</html>
