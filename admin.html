<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --bg: #121418; --card: #1e2025; --primary: #d4537e; --text: #ffffff; --border: #2a2d35; }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; margin: 0; }

        /* الهيدر: الشعار يمين والأزرار يسار */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--card); border-bottom: 2px solid var(--primary); }
        .nav-left { display: flex; gap: 15px; }
        .nav-left button { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        
        .stats-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 30px; }
        .stat-card { background: var(--card); padding: 25px; text-align: center; border-radius: 8px; border: 1px solid var(--border); }
        .stat-num { font-size: 28px; font-weight: bold; color: var(--primary); }

        .table-section { padding: 0 30px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
        th { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); color: #94a3b8; }
        td { padding: 15px; border-bottom: 1px solid var(--border); }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-action { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; color: white; }
        .view { background: #3b82f6; } .edit { background: #f59e0b; } .delete { background: #ef4444; }
    </style>
</head>
<body>

<div class="header">
    <div class="nav-left">
        <button>بحث 🔍</button>
    </div>
    <div class="logo-area">
        <div style="text-align: right;">
            <div style="font-weight: bold;">مركز الشلول للتايكوندو</div>
            <div style="font-size: 11px; color: #888;">نظام إدارة الطلاب</div>
        </div>
        <img src="https://via.placeholder.com/40" alt="Logo">
    </div>
</div>

<div class="stats-container">
    <div class="stat-card"><div class="stat-num" id="total-count">0</div><div>إجمالي الطلاب</div></div>
    <div class="stat-card"><div class="stat-num" id="male-count">0</div><div>عدد الذكور</div></div>
    <div class="stat-card"><div class="stat-num" id="female-count">0</div><div>عدد الإناث</div></div>
    <div class="stat-card"><div class="stat-num" id="baby-count">0</div><div>عدد الرضع (< 1 سنة)</div></div>
</div>

<div class="table-section">
    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>الجنس</th>
                <th>هاتف الأم</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { /* أضف بيانات الـ config هنا */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "registrations"), (snapshot) => {
        let males = 0, females = 0, babies = 0;
        const tbody = document.getElementById("data-body");
        tbody.innerHTML = "";
        
        snapshot.forEach((docSnap) => {
            const d = docSnap.data();
            
            // حساب الإحصائيات
            if(d.gender === 'ذكر') males++;
            if(d.gender === 'أنثى') females++;
            if(d.age_years < 1) babies++; // بافتراض وجود حقل age_years أو تاريخ ميلاد

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${d.fullname || '---'}</td>
                <td>${d.gender || '---'}</td>
                <td>${d.mother_phone || '---'}</td>
                <td class="action-btns">
                    <button class="btn-action view" onclick="alert('عرض')">👁️</button>
                    <button class="btn-action edit" onclick="alert('تعديل')">✏️</button>
                    <button class="btn-action delete" onclick="deleteDoc(doc(db, 'registrations', '${docSnap.id}'))">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("total-count").innerText = snapshot.size;
        document.getElementById("male-count").innerText = males;
        document.getElementById("female-count").innerText = females;
        document.getElementById("baby-count").innerText = babies;
    });
</script>
</body>
</html>
