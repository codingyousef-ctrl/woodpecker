<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل الحضانة | حضانة نقار الخشب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #121418; --card: #1e2025; --text: #ffffff; --muted: #94a3b8; 
            --primary: #d4537e; --primary-hover: #b8436b; --border: #2a2d35; --input-bg: #121418;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 30px 15px; display: flex; justify-content: center; min-height: 100vh; }
        .form-card { background: var(--card); padding: 40px 30px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 900px; }
        .header { text-align: center; margin-bottom: 35px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .header img { height: 150px; width: auto; margin-bottom: 15px; }
        .section-title { color: var(--primary); font-size: 18px; font-weight: 700; margin: 25px 0 15px 0; border-bottom: 2px solid var(--border); padding-bottom: 5px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: right; }
        .full-width { grid-column: 1 / -1; }
        label { color: var(--muted); font-size: 14px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; }
        .btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 25px; }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header">
        <img src="https://images.gemini.googleusercontent.com/v1/images/r/3588f2195f00e932" alt="Logo">
        <h2>استمارة تسجيل حضانة نقار الخشب</h2>
    </div>

    <form id="regForm">
        <div class="section-title">👶 معلومات الطفل</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label>الاسم الرباعي للطفل *</label>
                <input type="text" id="childName" required>
            </div>
            <div class="form-group">
                <label>تاريخ الميلاد *</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>العمر الحالي *</label>
                <select id="age" required>
                    <option value="" disabled selected>اختر الفئة العمرية</option>
                    <option value="أقل من سنة">أقل من سنة</option>
                    <option value="سنة - سنتين">سنة إلى سنتين</option>
                    <option value="سنتين - 3 سنوات">سنتين إلى 3 سنوات</option>
                    <option value="3 - 4 سنوات">3 إلى 4 سنوات</option>
                    <option value="4 - 5 سنوات">4 إلى 5 سنوات</option>
                </select>
            </div>
            <div class="form-group">
                <label>الجنس *</label>
                <select id="gender" required>
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>
        </div>

        <div class="section-title">👨‍👩‍👦 معلومات الوالدين</div>
        <div class="form-grid">
            <div class="form-group"><label>اسم الأم الكامل *</label><input type="text" id="motherName" required></div>
            <div class="form-group"><label>رقم هاتف الأم المباشر *</label><input type="tel" id="motherPhone" required></div>
        </div>

        <button type="submit" class="btn" id="subBtn">إرسال الاستمارة</button>
    </form>
</div>
