<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حضانة نقار الخشب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121418; --card: #1e2025; --text: #ffffff; --primary: #d4537e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        /* شاشة التحميل (الترحيب) */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loader img { width: 200px; height: auto; margin-bottom: 20px; animation: pulse 2s infinite; }
        #loader h1 { color: var(--primary); font-size: 24px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* إخفاء الاستمارة في البداية */
        #main-content { display: none; padding: 20px; }
        
        /* باقي التنسيقات كما هي */
        .form-card { background: var(--card); padding: 30px; border-radius: 12px; margin: 20px auto; max-width: 500px; }
    </style>
</head>
<body>

<!-- شاشة الترحيب -->
<div id="loader">
    <img src="Wood.png" alt="شعار الحضانة">
    <h1>حضانة نقار الخشب ترحب بكم</h1>
</div>

<!-- محتوى الاستمارة -->
<div id="main-content">
    <div class="form-card">
        <!-- بقية كود الاستمارة يوضع هنا -->
        <h2>استمارة التسجيل</h2>
        <p>أهلاً بك، يرجى تعبئة البيانات...</p>
    </div>
</div>

<script>
    // إخفاء شاشة الترحيب بعد 4 ثوانٍ
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }, 800);
        }, 4000);
    });
</script>

</body>
</html>
