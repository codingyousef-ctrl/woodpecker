<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التسجيل | حضانة نقار الخشب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121418; --card: #1e2025; --text: #ffffff; --muted: #94a3b8; --primary: #d4537e; --border: #2a2d35; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-card { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 500px; text-align: center; }
        
        /* تنسيق الشعار الجديد في رأس الصفحة */
        .form-card img { height: 85px; width: auto; object-fit: contain; margin-bottom: 15px; }
        
        .form-card h2 { color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .btn:hover { background: #b8436b; }
        .success { color: #10b981; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-card">
    <!-- الشعار يظهر هنا تلقائياً بمجرد رفع صورة باسم logo.png -->
    <img src="Wood.png" alt="شعار الحضانة" onerror="this.style.display='none';">
    
    <h2>📋 استمارة التسجيل</h2>
    <form id="regForm">
        <div class="form-group">
            <label>اسم الطفل الثلاثي</label>
            <input type="text" id="childName" required>
        </div>
        <div class="form-group">
            <label>اسم الأم</label>
            <input type="text" id="motherName" required>
        </div>
        <div class="form-group">
            <label>رقم هاتف الأم</label>
            <input type="tel" id="motherPhone" required placeholder="07xxxxxxx">
        </div>
        <button type="submit" class="btn" id="subBtn">إرسال الاستمارة</button>
    </form>
    <div id="msg" class="success">🎉 تم إرسال طلبك بنجاح!</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPkQg_4ilvZoLZ7qdRYb_0Gq1pCHylQ0",
        authDomain: "woodpecker-508d8.firebaseapp.com",
        projectId: "woodpecker-508d8",
        storageBucket: "woodpecker-508d8.firebasestorage.app",
        messagingSenderId: "434327620481",
        appId: "1:434327620481:web:99d8d5e0af9ae5eafa3680"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('subBtn');
        btn.disabled = true;
        btn.innerText = "جاري الإرسال...";

        try {
            await addDoc(collection(db, "registrations"), {
                fullname: document.getElementById('childName').value,
                mother_name: document.getElementById('motherName').value,
                mother_phone: document.getElementById('motherPhone').value,
                timestamp: new Date()
            });
            document.getElementById('msg').style.display = 'block';
            document.getElementById('regForm').reset();
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال، حاول مرة أخرى");
        } finally {
            btn.disabled = false;
            btn.innerText = "إرسال الاستمارة";
        }
    });
</script>

</body>
</html>
